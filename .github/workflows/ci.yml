name: RELIC-10M CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-tests:
    name: Rust Workspace Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests across workspace
        run: cargo test --workspace --verbose

      - name: Build release binaries
        run: cargo build --workspace --release

  python-verification:
    name: Python Architectural Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch safetensors tokenizers

      - name: Verify architectural configuration
        run: |
          python -c "import sys; sys.path.insert(0, 'python'); from relic import RelicConfig, RelicForCausalLM; m = RelicForCausalLM(RelicConfig()); assert m.count_parameters() == 10031328; print('Parámetros verificados: 10,031,328')"
