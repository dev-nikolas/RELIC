name: CI RELIC

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (cero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Suite completa (incluye bancos congelados y known failures)
        run: cargo test --workspace
