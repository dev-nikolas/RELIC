name: CI RELIC

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-rust@v1
        with:
          profile: minimal
          toolchain: stable
      - name: Suite completa (incluye suite congelada no vista v2 y known failures)
        run: cargo test --workspace
      - name: Sucesiones de regresión del servidor (known_failures.json)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo test -p relic_server --test regression_known_failures -- --nocapture
